name: Generate Snake & Stats

on:
  # a cada 12 horas
  schedule:
    - cron: "0 */12 * * *"
  # manual pela aba Actions
  workflow_dispatch:
  # a cada push na main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # card de estatísticas próprio (scripts/stats.mjs), sem depender de serviços externos
      - name: Generate stats SVG
        run: node scripts/stats.mjs ${{ github.repository_owner }} dist/stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # gera a cobrinha a partir do gráfico de contribuições, nas cores da capa
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0000f8&color_dots=#ebedf0,#c9ceff,#8c96ff,#4655ff,#0000f8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#6e7bff&color_dots=#161b22,#0d1366,#1621b3,#2a38ff,#6e7bff

      # tira a barra de progresso de baixo da cobrinha
      - name: Trim snake progress bar
        run: node scripts/trim-snake.mjs dist/github-snake.svg dist/github-snake-dark.svg

      # publica os SVGs na branch "output"
      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
