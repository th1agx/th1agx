<svg xmlns="http://www.w3.org/2000/svg" width="900" height="46" viewBox="0 0 900 46" role="img" aria-label="ATIVIDADE">
  <style>
    .t{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;font-size:16px;letter-spacing:6px}
    .c{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .l{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.6s ease-out .9s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .r{clip-path:inset(0 100% 0 0);animation:type 0.63s steps(9) .2s forwards}
    @keyframes type{to{clip-path:inset(0 0 0 0)}}
  </style>
  <defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <line class="l" x1="226" y1="23" x2="900" y2="23" stroke="#5a63c4" stroke-opacity=".6"/>
  <rect x=".5" y="6.5" width="226" height="33" rx="6" fill="#03040a" stroke="#161b44"/>
  <path d="M1 18 V12 a6 6 0 0 1 6 -6 H14" fill="none" stroke="#1f2dff" stroke-width="2" filter="url(#glow)"/>
  <text x="16" y="28" class="t" fill="#5a63c4" style="font-size:12px;letter-spacing:1px">04</text>
  <text x="52" y="29" class="t r" fill="#6e7bff" textLength="156" lengthAdjust="spacingAndGlyphs">ATIVIDADE</text>
  <rect class="c" x="208" y="16" width="8" height="14" fill="#1f2dff" filter="url(#glow)"/>
</svg>
