<svg xmlns="http://www.w3.org/2000/svg" width="900" height="46" viewBox="0 0 900 46" role="img" aria-label="TRAJETÓRIA">
  <style>
    .t{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;font-size:16px;letter-spacing:6px}
    .c{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
