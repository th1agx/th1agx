  <line class="l" x1="244" y1="23" x2="900" y2="23" stroke="#7f9a24" stroke-opacity=".6"/>
  <rect x=".5" y="6.5" width="244" height="33" rx="6" fill="#0a0c07" stroke="#232b14"/>
